config_version = "0"

exclude_patterns = [
  # Repo-specific: a build artifact and the user-file store.
  "public/style/main.min.css",
  "storage/**",
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
# Duplication and complexity, reported not enforced. These are judgment calls —
# a long function with a reason is not a defect — so they inform rather than
# fail. Revisit if the codebase starts growing functions nobody can read.
mode = "comment"

[[source]]
name = "default"
default = true

# ---------------------------------------------------------------- plugins ----
#
# Modes, and why each one is where it is. This list is deliberately short: the
# previous tool (SonarCloud, retired 2026-08-03) reported 258 open findings, of
# which 86 were shell style in the deploy scripts and 31 were optional-chaining
# nudges, against 16 real bugs. Nobody reads 258 of anything. A small set that
# gets read beats a large one that gets ignored.
#
#   block    fails the run. Reserved for things that must never ship.
#   comment  reports and does not fail. The default for everything real.
#   monitor  tracked silently. For things being watched, not acted on.

# Secrets. The only thing here that blocks, because a committed credential is
# not a style opinion and cannot be un-leaked.
[[plugin]]
name = "trufflehog"
mode = "block"

[[plugin]]
name = "gitleaks"
mode = "block"

# TypeScript and JavaScript — most of this codebase, and what the default init
# covers with nothing at all. Biome over ESLint: one binary, no plugin tree, and
# it reads the existing config rather than needing its own.
[[plugin]]
name = "biome"
mode = "comment"

# Shell. `comment`, deliberately: the deploy scripts are where the last tool
# generated most of its noise, and a large mechanical sweep across the scripts
# that touch production is a bad trade. Read the findings, fix the real ones.
[[plugin]]
name = "shellcheck"
mode = "comment"

[[plugin]]
name = "hadolint"
mode = "comment"

# Formatting. Reports only — reformatting on someone's behalf mid-review is
# rude, and the house rule is that lint issues get fixed in code.
#
# **SCSS is excluded and that is not laziness.** Qlty does not read the repo's
# .prettierrc (nor a copy in .qlty/configs/, nor a `config_files` entry — all
# three were tried on 2026-08-03), so it formats with its own defaults. The one
# that matters is `singleQuote`, which .prettierrc explicitly turns *off* for
# SCSS: this repo writes `@use "tokens"`. Left on, qlty flagged 13 of the 14
# SCSS files purely over quote style, disagreeing with the project's own config
# and with `npx prettier` — 13 findings that were all wrong. SCSS is still
# formatted, by prettier, using the config at the repo root.
[[plugin]]
name = "prettier"
mode = "comment"

[[exclude]]
plugins = ["prettier"]
file_patterns = ["**/*.scss"]

# Markdown. The docs here are long-form and load-bearing, and the house rules
# (no hard-wrapped prose, tight em dashes) are enforced separately by
# utils/tighten-em-dashes.mjs in a pre-commit hook.
[[plugin]]
name = "markdownlint"
mode = "comment"

# GitHub Actions, for when there are any.
[[plugin]]
name = "actionlint"
mode = "comment"

# ------------------------------------------------------------ exclusions ----

# Rule-level suppression lives in each plugin's own config under
# .qlty/configs/, not here — qlty.toml has no `rules` key on [[exclude]], and
# the plugin's native config is portable to anyone running the linter directly.
# See .qlty/configs/.markdownlint.yaml and .shellcheckrc.

