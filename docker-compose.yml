# Local dev + NAS base. For local dev, run only Postgres:
#   docker compose up -d --wait db
# The app runs via `npm run dev` (hot reload) and connects on 127.0.0.1:5432.
# The app service is added at deploy time (Phase 5).
services:
  db:
    image: postgres:17-alpine
    container_name: tankbag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tankbag
      POSTGRES_PASSWORD: tankbag_dev_pw
      POSTGRES_DB: tankbag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tankbag-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tankbag -d tankbag"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  tankbag-db-data:
