# Local dev + NAS base. For local dev, run only Postgres:
#   docker compose up -d --wait db
# The app runs via `npm run dev` (hot reload) and connects on 127.0.0.1:5432.
# The app service is added at deploy time (Phase 5).
services:
  db:
    image: postgres:17-alpine
    container_name: routeloop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: routeloop
      POSTGRES_PASSWORD: routeloop_dev_pw
      POSTGRES_DB: routeloop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - routeloop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeloop -d routeloop"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  routeloop-db-data:
