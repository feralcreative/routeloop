# routeloop — NAS stack (app + Postgres).
#
# This file is transferred to the NAS as docker-compose.yml by
# utils/deploy/deploy.sh, which also writes the .env beside it that supplies
# every ${VAR} below. It is deliberately separate from the root
# docker-compose.yml, which is local-dev-only (Postgres alone).
#
# cloudflared runs natively on the Synology host, so the app is published on
# 127.0.0.1 only — the tunnel reaches it at http://localhost:${HOST_PORT}
# and nothing is exposed to the LAN.
services:
  app:
    image: ${IMAGE_NAME}
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    # The image's own user is node (uid 1000), but ./data/storage lives on a
    # Synology share whose ACL grants no access to uid 1000 — the app gets
    # "Permission denied" on every KML/GPX read. Synology ACLs cannot be granted
    # to a bare numeric uid, so the container runs as the host owner instead.
    # Supplied by the .env deploy.sh writes; see APP_UID/APP_GID in deploy.config.
    user: "${APP_UID}:${APP_GID}"
    environment:
      PORT: 6686
      STORAGE_PATH: /app/moto-storage
      GMAPS_KEY: ${GMAPS_KEY}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      DATABASE_URL: postgresql://routeloop:${DB_PASSWORD}@db:5432/routeloop
      # Cloudflare Access supplies identity at the edge. APP_ORIGIN also decides
      # the Secure flag on routeloop's local session cookie.
      APP_ORIGIN: ${APP_ORIGIN}
    ports:
      - "127.0.0.1:${HOST_PORT}:6686"
      - "127.0.0.1:${ALIAS_HOST_PORT}:6686"
    volumes:
      - ./data/storage:/app/moto-storage
    depends_on:
      db:
        condition: service_healthy
    networks:
      - routeloop

  db:
    image: postgres:17-alpine
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    # No ports: — Postgres is reachable only from the app over the bridge.
    environment:
      POSTGRES_USER: routeloop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: routeloop
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeloop -d routeloop"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - routeloop

volumes:
  db-data:

networks:
  routeloop:
    driver: bridge
