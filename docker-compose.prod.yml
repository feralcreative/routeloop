    depends_on:
      db:
        condition: service_healthy
    profiles: ["green"]
    networks:
      - routeloop

  # ONE-SHOT. It has no container_name because `docker-compose run` generates
  # its own, and no restart policy that could bring it back — it applies the
  # migrations, exits, and is removed by `--rm`.
  #
  # WHY THIS IS NOT `docker exec` INTO THE APP ANYMORE. It used to be, in
  # utils/deploy/hooks/post-deploy.sh, and it ran AFTER the new container was
  # already serving traffic — so every deploy carrying a migration had a window
  # where new code was answering requests against the old schema. docs/STATUS.md
  # named the consequence out loud: deploy the alternates code without 0003 and
  # every save 500s. Running it as its own container BEFORE the app is recreated
  # closes that window, and costs nothing, because it is the same image.
  #
  # It reaches Postgres over the same bridge network and needs nothing else from
  # the app's environment — drizzle.config.ts reads DATABASE_URL and nothing more.
  migrate:
    image: ${IMAGE_NAME}
    restart: "no"
    user: "${APP_UID}:${APP_GID}"
    environment:
      DATABASE_URL: postgresql://routeloop:${DB_PASSWORD}@db:5432/routeloop
    command: ["npx", "drizzle-kit", "migrate"]
    # Profiled so a bare `up -d` cannot run migrations as a side effect. Naming
    # the service explicitly — which is what `run --rm ... migrate` does — still
    # works, so the deploy is unaffected.
    profiles: ["tools"]
    networks:
      - routeloop

  db:
    image: postgres:17-alpine
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    # No ports: — Postgres is reachable only from the app over the bridge.
    environment:
      POSTGRES_USER: routeloop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: routeloop
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routeloop -d routeloop"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - routeloop

volumes:
  db-data:
    # PINNED TO THE NAME THE RUNNING VOLUME ALREADY HAS. Compose addresses a
    # volume as <COMPOSE_PROJECT_NAME>_db-data, so a changed project name or a
    # reshaped volume block makes it create a NEW EMPTY one — Postgres
    # initializes a fresh database into it, the container passes its
    # healthcheck, and the deploy reports success while every rider's account is
    # gone. That is trap #2 in docs/deployment.md and it has bitten this project
    # already. Naming it explicitly turns that silent loss into a loud failure:
    # if the volume is not there, Compose errors out instead of inventing one.
    name: ${DB_VOLUME_NAME}

networks:
  routeloop:
    driver: bridge
