name: CI

# Pull requests, and pushes to main so a direct commit is checked too.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the run still going for the first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # THE FLOOR AND THE SHIPPED VERSION, in that order. 22 is the oldest Node
      # package.json's `engines` claims to support; 24 is what the Dockerfile
      # ships and what development happens on. Testing both is what keeps the
      # claim honest — a 24-only API would otherwise pass here and break for
      # anyone on the floor.
      #
      # That is the rule to apply when this moves again, rather than a pair of
      # numbers to bump: match `engines` and the Dockerfile, and if they ever
      # become the same version, say so and drop to one entry rather than
      # leaving a second that tests nothing.
      #
      # It was 20 and 22 until 2026-08-16. Node 20 went end-of-life on
      # 2026-04-30, so CI had been gating every PR on an unsupported runtime.
      matrix:
        node: ['22', '24']

    name: node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # No database service: the suite is deliberately scoped to pure logic
      # (see vitest.config.ts), so nothing here needs Postgres. If a test ever
      # does, adding a service container is a decision to take on purpose.
      - run: npm test
