# Version updates for the ONE ecosystem that is a supply-chain surface for CI.
#
# GitHub Actions only, deliberately. An action referenced by a moving tag runs
# whatever that tag points at today, inside a workflow that will soon hold
# registry and SSH credentials — so keeping those current is worth a PR a month.
#
# npm is NOT here, and its absence is a decision rather than an oversight.
# Dependabot's SECURITY updates are already enabled for it at the repository
# level, which is the half that matters; version updates on top would open a PR
# for every minor bump of every dependency, and a queue nobody reads is worse
# than no queue at all. Add it the day someone wants to spend time on it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    labels:
      - 'area:ops'
    # ONE PR PER RUN, NOT ONE PER ACTION. The first run opened three — checkout,
    # setup-node and docker/login-action, two of them three majors behind — which
    # is a fair sample of what an ungrouped config produces every month.
    #
    # Grouping is the right trade HERE and would not be everywhere: these are
    # four or five pinned actions that move together and are validated by the
    # same CI run, so reviewing them as one diff loses nothing. The argument
    # against grouping — that one bad bump makes the whole PR unmergeable — is
    # weak at this size and would not be for npm, which is why npm is still not
    # in this file at all.
    groups:
      actions:
        patterns: ['*']
